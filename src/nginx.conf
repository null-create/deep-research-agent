server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ensure .mjs files are served with the correct MIME type
    types {
        application/javascript mjs;
    }
    include /etc/nginx/mime.types;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml+rss application/json;

    # Proxy API requests to backend.
    # NGINX_BACKEND_URL is substituted at container start via envsubst (nginx template mechanism).
    # In Azure Container Apps this is set to the backend Container App's internal FQDN.
    location /api {
        proxy_pass $NGINX_BACKEND_URL/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy file operations directly to the file handler MCP server.
    # NGINX_FILE_HANDLER_URL is substituted at container start via envsubst.
    location /files {
        proxy_pass $NGINX_FILE_HANDLER_URL;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 50M;
    }

    # Proxy WebSocket connections to backend.
    location /ws {
        proxy_pass $NGINX_BACKEND_URL;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}